name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check (branch protection): keep the job id "compile".
  compile:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Compile NexusWpp
        shell: pwsh
        run: .\compile.ps1

      # JavaScript rules, then xUnit: feature rules and the off-screen WinForms and WebView2 harnesses (host, settings,
      # mouse hook, runtime pause, responsive layout); no desktop attachment, no user data touched.
      - name: Tests (JavaScript and xUnit)
        shell: pwsh
        run: .\scripts\test_features.ps1

      - name: Keep test output on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-output
          path: work/
          if-no-files-found: ignore

  # The real installer on a disposable runner: silent install, checks, silent uninstall.
  installer:
    runs-on: windows-latest
    needs: compile
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build the installer
        shell: pwsh
        run: .\scripts\build_installer.ps1

      - name: Install and uninstall silently
        shell: pwsh
        run: .\scripts\test_installer.ps1
