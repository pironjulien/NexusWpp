name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check (branch protection): keep the job id "compile".
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compile NexusWpp
        shell: pwsh
        run: .\compile.ps1

      - name: Sensor and alert rules (native + telemetry_state.test.js)
        shell: pwsh
        run: .\scripts\test_features.ps1

  # Off-screen WinForms and WebView2 suites: no desktop attachment, no user data touched.
  ui-tests:
    runs-on: windows-latest
    needs: compile
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compile NexusWpp
        shell: pwsh
        run: .\compile.ps1

      - name: Settings window and custom logo
        shell: pwsh
        run: .\scripts\test_settings.ps1

      - name: Runtime pause and Content-Security-Policy
        shell: pwsh
        run: .\scripts\test_runtime_pause.ps1

      - name: Responsive layout (quick, FR and EN)
        shell: pwsh
        run: .\scripts\test_responsive_layout.ps1 -Quick -Label ci

      - name: Keep test output on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ui-test-output
          path: work/
          if-no-files-found: ignore
